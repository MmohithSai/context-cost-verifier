id: qa-07
workload: qa
segments:
  system: "@kestrel_persona"
  instructions: |
    Answer the customer's question using only the documents and the conversation.
    Reply with the value and its unit only: no explanation and no full sentence.
    Do not call any tools for questions that the documents already answer.
    If the documents do not contain the answer, reply exactly: unknown
  tools: "@kestrel_tools"
  examples: |
    Q: What is the top speed of the K2 Courier?
    A: 54 km/h

    Q: How long does a Stowbot S1 battery take to charge from empty?
    A: 95 minutes

    Q: Which colour options does the K9 Titan come in?
    A: unknown
  retrieved:
    - title: Stowbot S3 Sorter installation requirements
      text: |
        Minimum aisle width: 1.4 m. Minimum ceiling height: 2.6 m. Floor flatness tolerance: 3 mm
        over 2 m. Docks need a 16 A socket within 3 m of the aisle head.
    - title: Stowbot S1 installation requirements
      text: |
        Minimum aisle width: 1.1 m. Minimum ceiling height: 2.4 m. The S1 is the only Stowbot that
        will run in a narrow-aisle layout without a guide rail.
    - title: Stowbot S2 Pallet installation requirements
      text: |
        Minimum aisle width: 1.8 m, because the pallet forks swing outward when turning.
        Minimum ceiling height: 2.6 m.
    - title: Aisle guide rail kit
      text: |
        PRT-RAIL-14 is required in any aisle narrower than 1.6 m. It does not lower the minimum aisle
        width of a model; it only keeps the robot centred.
  history:
    - role: user
      content: Hello, we are laying out a new mezzanine and need the clearances for the fastest Stowbot.
    - role: assistant
      content: Of course. I can give you the installation requirements for any Stowbot model.
query: What is the minimum aisle width for the Stowbot S3 Sorter?
gold_doc: 0
grader:
  type: qa
  answers: ["1.4 m", "1.4m", "1.4 metres", "1.4 meters"]
  distractors: ["1.1 m", "1.8 m", "1.6 m"]
