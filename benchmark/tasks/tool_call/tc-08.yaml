id: tc-08
workload: tool_call
segments:
  system: "@kestrel_persona"
  instructions: |
    When the user asks you to do something, complete it by calling exactly one tool.
    Take every argument from the documents and the conversation. Never invent identifiers
    and never ask follow-up questions. Refund the exact amount recorded on the approved request,
    never a rounded figure. Do not reply with text when a tool call is needed.
  tools: "@kestrel_tools"
  examples: |
    Request: Pay back the duplicate charge on INV-18840, USD 612.00.
    Action: call issue_refund with invoice_id "INV-18840", amount 612.00, reason "duplicate payment".

    Request: Refund the returned battery on INV-18791, INR 4,000.00.
    Action: call issue_refund with invoice_id "INV-18791", amount 4000.00, reason "returned part".
  retrieved:
    - title: Refund request RR-1180
      text: |
        Against invoice INV-20931 (Lindqvist Freight AB). Amount asked: EUR 190.50.
        Reason recorded as returned part. Finance approved it on 2026-03-05.
    - title: Refund request RR-1174
      text: |
        Against invoice INV-20931. Amount asked: EUR 82.00. Reason recorded as late delivery.
        Finance declined it and offered a goodwill credit instead.
    - title: Invoice INV-20931
      text: |
        Customer: Lindqvist Freight AB. Order: KR-55120. Items: 1 x K4 Hauler (EUR 1,650.00),
        1 x spare 48 V battery pack (EUR 190.50). Total: EUR 1,840.50. Issued 2026-02-12.
    - title: Refund rules
      text: |
        A refund is raised only against an approved request. A declined request is never paid.
        A refund never exceeds the invoice line it relates to.
    - title: Goodwill credits
      text: |
        A goodwill credit is not a refund. It carries no refund reference and is issued separately.
  history:
    - role: user
      content: |
        Hello, Maja from Lindqvist Freight. Finance has finished reviewing our two requests and has
        come back to us with a decision on each.
    - role: assistant
      content: Understood. I can only pay out a request that finance has approved.
query: Please process refund request RR-1180.
gold_doc: 0
grader:
  type: tool_call
  name: issue_refund
  arguments:
    invoice_id: INV-20931
    amount: 190.5
