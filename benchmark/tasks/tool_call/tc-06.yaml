id: tc-06
workload: tool_call
segments:
  system: "@kestrel_persona"
  instructions: |
    When the user asks you to do something, complete it by calling exactly one tool.
    Take every argument from the documents and the conversation. Never invent identifiers
    and never ask follow-up questions. Always check stock at the customer's own warehouse.
    Do not reply with text when a tool call is needed.
  tools: "@kestrel_tools"
  examples: |
    Request: Do you have propeller sets in Hyderabad?
    Action: call check_stock with sku "PRT-PROP-K4", warehouse "HYD".

    Request: How many guide rail kits are in the Bengaluru warehouse?
    Action: call check_stock with sku "PRT-RAIL-14", warehouse "BLR".
  retrieved:
    - title: Stowbot spare parts catalogue (extract)
      text: |
        PRT-PAD-S1: gripper pad set, Stowbot S1. PRT-PAD-S2: gripper pad set, Stowbot S2 Pallet and
        S3 Sorter. PRT-WHL-S2: drive wheel, S2 Pallet and S3 Sorter.
        PRT-TRY-S2: parcel tray accessory for the S2 Pallet.
    - title: K-series spare parts catalogue (extract)
      text: |
        PRT-BAT-48V: spare 48 V battery pack. PRT-ARM-K3: motor arm, K3 Sparrow.
        PRT-COWL-K5: splash cowling, K5 Freighter. PRT-PROP-K4: propeller set, K4 Hauler.
    - title: Warehouse codes
      text: |
        HYD serves the Hyderabad region, PNQ serves the Pune region, BLR serves the Bengaluru region.
        A customer is always served from the warehouse in their registered city.
    - title: Gripper pad fitting note
      text: |
        A pad set is replaced as a complete set, never individually, because mixed pad depths make
        the robot drop light items.
    - title: Discontinued parts
      text: |
        PRT-PAD-S0, the pad set for the withdrawn Stowbot prototype, is no longer stocked and orders
        for it are rejected automatically.
  history:
    - role: user
      content: |
        Hello, Priya at Whitefield Robotics. We are registered in Bengaluru. Our S3 Sorter units are
        dropping small items and the pads look worn right down.
    - role: assistant
      content: That is the classic sign of worn gripper pads on an S3 Sorter, and they go as a full set.
query: Can you check whether you have those pads in stock for us?
gold_doc: 0
grader:
  type: tool_call
  name: check_stock
  arguments:
    sku: PRT-PAD-S2
    warehouse: BLR
