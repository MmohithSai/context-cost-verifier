[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "context-cost-verifier"
version = "0.1.0"
description = "Measure whether shrinking LLM context really saves cost: physical GPU metrics, exact token attribution and Shapley ablations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "transformers>=4.45",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
compress = ["llmlingua>=0.2.2"]
dev = ["pytest>=8"]

[project.scripts]
ccv = "ccv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ccv"]
